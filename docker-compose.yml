services:
  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # site:
  #   image:
volumes:
  postgres_data:
